name: Android Build

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: 'Unique build identifier'
        required: true
      projectId:
        description: 'AI Project ID'
        required: true
      exportId:
        description: 'Immutable export identifier'
        required: true
      projectVersion:
        description: 'Export package version'
        required: true
      manifestChecksum:
        description: 'SHA-256 checksum of export package'
        required: true
      targetPlatform:
        description: 'Platform to compile'
        required: true
      buildProfile:
        description: 'Build profile (debug/release)'
        required: true
      sourceDownloadUrl:
        description: 'URL to download the immutable export'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Immutable Export
        run: |
          echo "Downloading export from ${{ github.event.inputs.sourceDownloadUrl }}"
          wget -qO export.zip "${{ github.event.inputs.sourceDownloadUrl }}" || { echo "BUILD_SOURCE_UNAVAILABLE"; exit 1; }

      - name: Validate Integrity
        run: |
          echo "${{ github.event.inputs.manifestChecksum }}  export.zip" > checksum.sha256
          sha256sum -c checksum.sha256 || { echo "Integrity check failed"; exit 1; }
          unzip -q export.zip -d project_source

      - name: Build Android Artifact
        run: |
          cd project_source
          chmod +x gradlew
          if [ "${{ github.event.inputs.buildProfile }}" == "release" ]; then
            ./gradlew bundleRelease
            ARTIFACT_PATH="app/build/outputs/bundle/release/app-release.aab"
          else
            ./gradlew assembleDebug
            ARTIFACT_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          if [ ! -f "$ARTIFACT_PATH" ]; then
             echo "Build failed: Artifact not found at $ARTIFACT_PATH"
             exit 1
          fi
          
          # Calculate SHA-256
          sha256sum "$ARTIFACT_PATH" > ../artifact_checksum.txt
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$(basename $ARTIFACT_PATH)" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.buildId }}-${{ env.ARTIFACT_NAME }}
          path: project_source/${{ env.ARTIFACT_PATH }}
